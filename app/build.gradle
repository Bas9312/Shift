plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.android.libraries.mapsplatform.secrets.gradle.plugin)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'bas.app.shift'
    compileSdk 35

    defaultConfig {
        applicationId "bas.app.shift"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfigs {
            release {
                storeFile file('./keystore.jks')
                storePassword 'dFt56Yu2'
                keyAlias 'key0'
                keyPassword 'dFt56Yu2'
            }
        }
    }

    buildTypes {
        debug {
            // Debug сборка без baseline profile
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
    }
    
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        pickFirst 'META-INF/core-1.15.0.kotlin_module'
        pickFirst 'META-INF/core-1.17.1.kotlin_module'
        
        // Принудительно исключаем конфликтующие support классы
        exclude '**/android/support/v4/app/INotificationSideChannel.class'
        exclude '**/android/support/v4/app/INotificationSideChannel$Stub.class'
        exclude '**/android/support/v4/app/INotificationSideChannel$Stub$Proxy.class'
        exclude '**/android/support/v4/os/IResultReceiver.class'
        exclude '**/android/support/v4/os/IResultReceiver$Stub.class'
        exclude '**/android/support/v4/os/IResultReceiver$Stub$Proxy.class'
        exclude '**/android/support/v4/os/ResultReceiver.class'
        exclude '**/android/support/v4/os/ResultReceiver$1.class'
        exclude '**/android/support/v4/os/ResultReceiver$MyResultReceiver.class'
        exclude '**/android/support/v4/os/ResultReceiver$MyRunnable.class'
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.play.services.maps
    implementation libs.androidx.constraintlayout
    implementation ("com.google.android.gms:play-services-location:21.3.0")
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation libs.rxjava
    implementation libs.rxandroid
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.2.0")
    implementation 'com.airbnb.android:lottie:6.4.0'
    
    // ZXing для сканирования QR кодов (с исключением конфликтующих зависимостей)
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        exclude group: 'com.android.support'
        exclude group: 'androidx.core'
        exclude group: 'androidx.appcompat'
    }
    implementation 'com.google.zxing:core:3.5.2'
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation("com.google.firebase:firebase-crashlytics-ndk")
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.bugfender.sdk:android:3.+")

}

// Принудительно исключаем конфликтующие support библиотеки
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
        exclude group: 'com.android.support'
    }
}